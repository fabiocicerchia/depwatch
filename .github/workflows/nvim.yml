name: nvim

on:
  push:
    branches: [main, master]
    paths: ["extensions/nvim/**", ".github/workflows/nvim.yml"]
  pull_request:
    paths: ["extensions/nvim/**", ".github/workflows/nvim.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # stable is what people run; nightly is where a deprecation shows up first,
  # and this plugin is deliberately on the 0.11 API surface (vim.system,
  # vim.fs.relpath, vim.validate's callable form).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: rhysd/action-setup-vim@6ba49e35ceb7ba2426d1f4849e0d9723c4f21d3f  # v1.4.2
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Version
        run: nvim --version

      - name: Test
        working-directory: extensions/nvim
        run: make test

  # The plugin runs the CLI, so the contract between them is worth checking:
  # build depwatch, then drive the plugin against a real manifest with nothing
  # else on the runtimepath.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: rhysd/action-setup-vim@6ba49e35ceb7ba2426d1f4849e0d9723c4f21d3f  # v1.4.2
        with:
          neovim: true
          version: stable

      - name: Build the CLI
        run: |
          npm ci
          npm run build

      - name: Drive it against a real manifest
        working-directory: extensions/nvim
        run: nvim --headless --clean -u tests/smoke.lua
