# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: depwatch
  description: >-
      Dependency drift (libyears) and viability, plotted as a quadrant. Reads lock files and SBOMs,
      because a manifest range gives its floor and overstates how far behind you are.
  annotations:
    github.com/project-slug: fabiocicerchia/depwatch
    backstage.io/source-location: url:https://github.com/fabiocicerchia/depwatch/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/depwatch
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
