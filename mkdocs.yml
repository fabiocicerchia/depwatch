site_name: depwatch
site_description: >-
  Dependency drift (libyears) and viability, plotted as a quadrant.
repo_url: https://github.com/fabiocicerchia/depwatch
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - GitHub Action: github-action.md
  - VS Code extension: vscode.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
